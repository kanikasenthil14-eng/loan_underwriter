{% extends "base.html" %}
{% block title %}Login — CredPilot{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
            <h4 class="text-white fw-700 mb-1">CredPilot</h4>
            <p class="text-secondary small">Sign in to your account</p>
        </div>
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label class="form-label text-secondary small">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary small">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
                    <button class="input-group-text" type="button" onclick="togglePassword('password','eyeIcon')">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="remember" id="remember">
                    <label class="form-check-label text-secondary small" for="remember">Remember me</label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg">
                <i class="fas fa-sign-in-alt me-2"></i>Sign In
            </button>
        </form>
        <p class="text-center text-secondary mt-3 small">
            Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function togglePassword(id, iconId) {
    const input = document.getElementById(id);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye-slash'; }
    else { input.type = 'password'; icon.className = 'fas fa-eye'; }
}
</script>
{% endblock %}
