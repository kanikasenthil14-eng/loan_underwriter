{% extends "base.html" %}
{% block title %}Register — CredPilot{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" style="max-width:480px;">
        <div class="auth-logo">
            <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
            <h4 class="text-white fw-700 mb-1">Create Account</h4>
            <p class="text-secondary small">Join CredPilot today</p>
        </div>
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
                <label class="form-label text-secondary small">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary small">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary small">Mobile Number</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-phone"></i></span>
                    <input type="tel" name="mobile" class="form-control" placeholder="9876543210" pattern="[6-9][0-9]{9}" required>
                </div>
            </div>
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label text-secondary small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" id="pwd" class="form-control" placeholder="••••••••" minlength="6" required>
                    </div>
                </div>
                <div class="col-6">
                    <label class="form-label text-secondary small">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" name="confirm_password" id="cpwd" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg" onclick="return validatePasswords()">
                <i class="fas fa-user-plus me-2"></i>Create Account
            </button>
        </form>
        <p class="text-center text-secondary mt-3 small">
            Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function validatePasswords() {
    const p = document.getElementById('pwd').value;
    const c = document.getElementById('cpwd').value;
    if (p !== c) { alert('Passwords do not match!'); return false; }
    return true;
}
</script>
{% endblock %}
