{% extends "base.html" %}
{% block content %}
<div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon-sm"><i class="fas fa-shield-alt"></i></div>
            <span class="sidebar-brand">CredPilot</span>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-label">MAIN</div>
            <a href="{{ url_for('customer.dashboard') }}" class="nav-item {% if request.endpoint == 'customer.dashboard' %}active{% endif %}">
                <i class="fas fa-home"></i><span>Dashboard</span>
            </a>
            <a href="{{ url_for('customer.apply') }}" class="nav-item {% if request.endpoint == 'customer.apply' %}active{% endif %}">
                <i class="fas fa-plus-circle"></i><span>New Application</span>
            </a>
            <div class="nav-section-label mt-3">ACCOUNT</div>
            <a href="{{ url_for('auth.logout') }}" class="nav-item">
                <i class="fas fa-sign-out-alt"></i><span>Logout</span>
            </a>
        </nav>
        <div class="sidebar-user">
            <div class="user-avatar">{{ current_user.name[0].upper() }}</div>
            <div class="user-info">
                <div class="user-name">{{ current_user.name }}</div>
                <div class="user-role">Customer</div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="topbar">
            <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="topbar-title">{% block page_title %}Dashboard{% endblock %}</div>
            <div class="topbar-actions">
                <a href="{{ url_for('customer.apply') }}" class="btn btn-primary btn-sm">
                    <i class="fas fa-plus me-1"></i>New Application
                </a>
            </div>
        </div>
        <div class="content-area">
            {% block page_content %}{% endblock %}
        </div>
    </main>
</div>
{% endblock %}
